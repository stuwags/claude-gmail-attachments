<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>budget</title>
  <style>html,body{margin:0;height:100%;background:#101114}canvas{display:block;width:100vw;height:100vh}</style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      import { createBoardView } from '/src/render/scene.ts';

      const canvas = document.getElementById('stage');
      const view = createBoardView({ canvas, reducedMotion: false });
      window.__probe = { view, log: [] };

      let last = performance.now();
      function loop(now) {
        view.render(now - last);
        last = now;
        requestAnimationFrame(loop);
      }

      (async () => {
        await view.init();
        view.resize(1440, 900, 2);
        requestAnimationFrame(loop);
        window.__probe.ready = true;
      })();
    </script>
  </body>
</html>
